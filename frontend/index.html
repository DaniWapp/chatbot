<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asistente Virtual</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png" />
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
  <link rel="stylesheet" href="/static/style.css?v=23" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-title">
        <img id="institution-logo" class="institution-logo" src="" alt="" hidden />
        <div>
          <h1>Asistente Virtual</h1>
          <p id="institution-subtitle">Facultad de Ingeniería</p>
        </div>
      </div>
      <div class="header-actions">
        <button id="mark-solved-button" class="mark-solved-button" type="button">Marcar como solucionado</button>
        <span id="status-badge" class="status-badge offline" title="Estado del servidor">Conectando</span>
      </div>
    </header>

    <main id="chat-window" class="chat-window">
      <div id="empty-state" class="empty-state">
        <p>Pregúntame sobre reglamentos, matrículas, calendario académico, requisitos de grado y más.</p>
        <div class="suggestions">
          <button class="suggestion-chip" type="button">¿Cuáles son los requisitos para graduarme?</button>
          <button class="suggestion-chip" type="button">¿Cuándo empiezan las matrículas?</button>
          <button class="suggestion-chip" type="button">¿Puedo cancelar una asignatura?</button>
          <button class="suggestion-chip" type="button">¿Cuántos créditos puedo matricular?</button>
        </div>
      </div>
    </main>

    <div id="escalation-banner" class="escalation-banner" hidden>
      <span class="escalation-banner-text">
        Estás en <strong>modo humano</strong>: un asesor te está atendiendo.
      </span>
      <button id="banner-mark-solved-button" class="banner-mark-solved-button" type="button">Marcar como solucionado - Volver a modo bot</button>
    </div>

    <form id="chat-form" class="chat-input-bar">
      <input
        id="message-input"
        type="text"
        placeholder="Escribe tu pregunta..."
        autocomplete="off"
        maxlength="2000"
      />
      <button id="send-button" type="submit">Enviar</button>
    </form>
  </div>

  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/markdown-render.js"></script>
  <script src="/static/script.js?v=28"></script>
</body>
</html>
