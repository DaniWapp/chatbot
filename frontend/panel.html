<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Conversaciones - Facultad de Ingeniería</title>
  <link rel="stylesheet" href="/static/panel.css?v=26" />
</head>
<body>
  <div id="auth-gate" class="auth-gate">
    <form id="auth-form" class="auth-form">
      <h2>Panel de Conversaciones</h2>
      <p>Ingresa tu usuario y contraseña de administrador.</p>
      <input id="admin-username-input" type="text" placeholder="Usuario" autocomplete="username" />
      <input id="admin-password-input" type="password" placeholder="Contraseña" autocomplete="current-password" />
      <button type="submit">Entrar</button>
      <p id="auth-error" class="auth-error" hidden>Usuario o contraseña incorrectos.</p>
    </form>
  </div>

  <div id="panel-app" class="panel-app" hidden>
    <header class="panel-header">
      <div class="header-title">
        <h1>Panel de Conversaciones</h1>
        <p id="admin-display-name">Facultad de Ingeniería</p>
      </div>
      <div class="header-actions">
        <span id="ws-status" class="ws-status offline">Conectando</span>
        <button id="logout-button" class="logout-button" type="button">Cerrar sesión</button>
      </div>
    </header>

    <div class="panel-body">
      <aside class="session-list-panel">
        <div class="session-list-header">
          <span id="session-count">0 conversaciones</span>
          <button id="pending-chip" class="pending-chip" type="button" hidden>0 pendientes</button>
        </div>
        <ul id="session-list" class="session-list"></ul>
      </aside>

      <main class="conversation-panel">
        <div id="conversation-empty" class="conversation-empty">
          Selecciona una conversación de la lista para ver sus mensajes.
        </div>
        <div id="conversation-header" class="conversation-header" hidden>
          <button id="back-to-list" class="back-button" type="button" aria-label="Volver a la lista">←</button>
          <div class="conversation-title-group">
            <strong id="conversation-title"></strong>
            <span id="conversation-subtitle" class="conversation-subtitle" hidden></span>
          </div>
          <div class="conversation-header-actions">
            <select id="reassign-select" class="resolve-button" hidden>
              <option value="" selected disabled>Redirigir a...</option>
            </select>
            <button id="ask-continue-button" class="resolve-button" type="button" hidden>¿Necesita algo más?</button>
            <button id="resolve-button" class="resolve-button" type="button" hidden>Marcar como resuelto</button>
          </div>
        </div>
        <div id="conversation-messages" class="conversation-messages"></div>
        <form id="advisor-reply-form" class="advisor-reply-form" hidden>
          <input id="advisor-reply-input" type="text" placeholder="Escribe tu respuesta como asesor..." maxlength="2000" autocomplete="off" />
          <button type="submit">Enviar</button>
        </form>
      </main>
    </div>
  </div>

  <script src="/static/panel.js?v=25"></script>
</body>
</html>
